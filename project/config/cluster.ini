# Single-host port simulation: client, coordinator, one internal proxy, and all datanodes use localhost.
# The single cluster entry is only a compatibility container for the existing proxy-based data path;
# it does not represent a physical rack.

[cluster]
cluster_num = 1
datanode_per_cluster = 120
ip_mode = distributed
first_proxy_ip = 127.0.0.1
first_proxy_port = 50405
datanode_port_start = 17600
coordinator_ip = 127.0.0.1
client_ip = 127.0.0.1

[ssh]
user = root
